apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-deployment
  namespace: kn08
spec:
  replicas: 3
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      imagePullSecrets:
        - name: ecr-cred
      containers:
        - name: account
          image: 728126375725.dkr.ecr.us-east-1.amazonaws.com/kn08-account:v1
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionString
              valueFrom:
                secretKeyRef:
                  name: account-secret
                  key: ConnectionString
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: kn08
spec:
  type: NodePort
  selector:
    app: account
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
