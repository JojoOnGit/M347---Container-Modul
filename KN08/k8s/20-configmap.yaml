apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kn08
data:
  # Internal cluster URL the BuySell / SendReceive services use to reach Account.
  ACCOUNT_BASE_URL: "http://account-service:8080"

  # Browser-facing URLs baked into the frontend at container start (env.sh).
  # __EXT_HOST__ is replaced at deploy time with a node public IP (NodePort
  # phase) or the LoadBalancer DNS name (task 10). The <userId> token is
  # substituted client-side by the React app.
  FRONTEND_MS_ACCOUNT_HOLDINGS: "http://__EXT_HOST__:30808/Account/Cryptos/?userid=<userId>"
  FRONTEND_MS_ACCOUNT_FRIENDS: "http://__EXT_HOST__:30808/Account/Friends/?userid=<userId>"
  FRONTEND_MS_BUYSELL_BUY: "http://__EXT_HOST__:30802/buy"
  FRONTEND_MS_BUYSELL_SELL: "http://__EXT_HOST__:30802/sell"
  FRONTEND_MS_SENDRECEIVE_SEND: "http://__EXT_HOST__:30803/send"
