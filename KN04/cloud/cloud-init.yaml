#cloud-config
# source: https://gist.github.com/syntaqx/9dd3ff11fb3d48b032c84f3e31af9163
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/ubuntu
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  teacher
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFvOK7xwc05pO4dBSphlGIyFn22YVuPA/nrUp3nDSjQ jojo-m347
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true
groups:
  - docker
system_info:
  default_user:
    groups: [docker]
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - unattended-upgrades
final_message: "The system is finally up, after $UPTIME seconds"
write_files:
  - path: /opt/app/docker-compose.yml
    permissions: '0644'
    content: |
      services:
        web:
          build: ./web
          container_name: m347-kn04a-web
          ports:
            - "8080:80"
          networks:
            - kn04a-net
          depends_on:
            - db

        db:
          image: mariadb:latest
          container_name: m347-kn04a-db
          environment:
            MYSQL_ROOT_PASSWORD: root1234
            MYSQL_DATABASE: mydb
            MYSQL_USER: dbuser
            MYSQL_PASSWORD: dbpassword
          networks:
            - kn04a-net

      networks:
        kn04a-net:
          driver: bridge
          ipam:
            config:
              - subnet: 172.10.0.0/16
                ip_range: 172.10.5.0/24
                gateway: 172.10.5.254
  - path: /opt/app/web/Dockerfile
    permissions: '0644'
    content: |
      FROM php:8.0-apache
      WORKDIR /var/www/html
      COPY info.php .
      COPY db.php .
      RUN docker-php-ext-install mysqli
      EXPOSE 80
  - path: /opt/app/web/db.php
    permissions: '0644'
    content: |
      <?php
      $host = "m347-kn04a-db";
      $username = "root";
      $password = "root1234";
      $db = "mydb";

      $conn = mysqli_connect($host, $username, $password, $db);

      if (!$conn) {
          die("Connection failed: " . mysqli_connect_error());
      }

      echo "Connected successfully to database: " . $db;
      ?>
  - path: /opt/app/web/info.php
    permissions: '0644'
    content: |
      <?php
      phpinfo();
      ?>
runcmd:
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - cd /opt/app && docker compose up -d --build
