#cloud-config
# source: https://thenewstack.io/deploy-a-kubernetes-cluster-on-ubuntu-server-with-microk8s/
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, microk8s
    home: /home/ubuntu
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  teacher
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFvOK7xwc05pO4dBSphlGIyFn22YVuPA/nrUp3nDSjQ jojo-m347
groups:
  - microk8s
system_info:
  default_user:
    groups: [microk8s]
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true
packages:
  - curl
runcmd:
  - sudo snap install microk8s --classic
  - mkdir -p /home/ubuntu/.kube
  - usermod -a -G microk8s ubuntu
  - chown -R ubuntu:ubuntu /home/ubuntu/.kube
  - echo "alias kubectl='microk8s kubectl'" >> /home/ubuntu/.bashrc
  - microk8s status --wait-ready
